<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Acme Support - Contact</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <div class="logo">Acme Support</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="help.html">Help</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h1>Contact Support</h1>

            <p>Submit your request and our team will get back to you.</p>

            <form action="thankyou.html" method="post">
                <label for="fullname"> Full Name </label>

                <input type="text" id="fullname" name="fullname" required />

                <label for="email"> Email Address </label>

                <input type="email" id="email" name="email" required />

                <label for="subject"> Subject </label>

                <select id="subject" name="subject">
                    <option>General Inquiry</option>
                    <option>Technical Support</option>
                    <option>Feedback</option>
                </select>

                <label for="message"> Message </label>

                <textarea id="message" name="message" minlength="20" required></textarea>

                <fieldset>
                    <legend>How did you hear about us?</legend>

                    <label>
                        <input type="radio" name="source" value="google" />
                        Google
                    </label>

                    <label>
                        <input type="radio" name="source" value="friend" />
                        Friend
                    </label>

                    <label>
                        <input type="radio" name="source" value="social" />
                        Social Media
                    </label>
                </fieldset>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter" value="yes" />

                    Subscribe to our newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
</body>

</html>
